name: Cron

on:
  workflow_dispatch:
    inputs:
      login_check_only:
        description: '로그인 세션만 확인하고 후원 조회와 Webhook 전송 생략'
        type: boolean
        default: false

concurrency:
  group: toonation-cron
  cancel-in-progress: false

jobs:
  cron:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      CLOAKBROWSER_AUTO_UPDATE: 'false'
      CLOAKBROWSER_CACHE_DIR: ${{ github.workspace }}/.cache/cloakbrowser
      CLOAKBROWSER_LICENSE_KEY: ${{ secrets.CLOAKBROWSER_LICENSE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.11
      
      - name: Install dependencies
        run: deno install --frozen

      - name: Test profile encryption
        run: deno test --frozen -A profile-cache_test.ts

      - name: Resolve browser version
        id: browser
        env:
          BROWSER_PROFILE_KEY: ${{ secrets.BROWSER_PROFILE_KEY }}
        run: |
          deno eval --frozen '
            import { binaryInfo } from "cloakbrowser";
            import { profileCacheKey } from "./profile-cache.ts";
            if (!Deno.env.get("CLOAKBROWSER_LICENSE_KEY")?.trim()) {
              throw new Error("CLOAKBROWSER_LICENSE_KEY Secret을 등록해주세요.");
            }
            const { id } = await profileCacheKey(Deno.env.get("BROWSER_PROFILE_KEY"));
            const response = await fetch("https://cloakbrowser.dev/api/download/version", {
              headers: { "X-Platform": "windows-x64" },
              signal: AbortSignal.timeout(15_000),
            });
            if (!response.ok) throw new Error(`최신 브라우저 버전 조회 실패: HTTP ${response.status}`);
            const { version } = await response.json();
            if (typeof version !== "string" || !/^\d+(?:\.\d+){3,4}$/.test(version) || Number(version.split(".")[0]) < 151) {
              throw new Error("포터블 쿠키를 지원하는 최신 버전을 확인하지 못했습니다.");
            }
            const { cacheDir } = binaryInfo(version);
            await Deno.writeTextFile(Deno.env.get("GITHUB_OUTPUT"), `version=${version}\npath=${cacheDir}\nprofile-key-id=${id}\n`, { append: true });
            await Deno.writeTextFile(Deno.env.get("GITHUB_ENV"), `CLOAKBROWSER_VERSION=${version}\n`, { append: true });
            console.log(`이번 실행에서 사용할 최신 안정 버전: ${version}`);
          '

      - name: Cache CloakBrowser
        uses: actions/cache@v6
        with:
          path: ${{ steps.browser.outputs.path }}
          key: cloakbrowser-v2-windows-2025-${{ runner.arch }}-${{ steps.browser.outputs.version }}-${{ hashFiles('deno.lock') }}

      - name: Download CloakBrowser
        run: |
          deno eval --frozen '
            import { binaryInfo, ensureBinary } from "cloakbrowser";
            const path = await ensureBinary();
            if (path !== binaryInfo().binaryPath) {
              throw new Error("조회한 최신 버전과 다운로드 결과가 다릅니다. 다시 실행해주세요.");
            }
            console.log(path);
          '

      - name: Check browser launch
        run: |
          deno eval --frozen '
            import { launch } from "cloakbrowser";
            const browser = await launch();
            console.log(await browser.version());
            await browser.close();
          '

      - name: Install NetBird
        shell: pwsh
        run: |
          $netbirdDir = Join-Path $env:RUNNER_TEMP 'netbird'
          New-Item -ItemType Directory -Path $netbirdDir -Force | Out-Null
          $archive = 'netbird_0.79.0_windows_amd64.tar.gz'
          $releaseUrl = 'https://github.com/netbirdio/netbird/releases/download/v0.79.0'
          $archivePath = Join-Path $netbirdDir $archive
          $checksumsPath = Join-Path $netbirdDir 'checksums.txt'
          Invoke-WebRequest "$releaseUrl/$archive" -OutFile $archivePath -MaximumRetryCount 3 -RetryIntervalSec 5
          Invoke-WebRequest "$releaseUrl/netbird_0.79.0_checksums.txt" -OutFile $checksumsPath -MaximumRetryCount 3 -RetryIntervalSec 5

          $checksumLine = Get-Content $checksumsPath | Where-Object { ($_ -split '\s+')[1] -eq $archive }
          if (-not $checksumLine) { throw 'NetBird checksum not found.' }
          $expectedHash = ($checksumLine -split '\s+')[0]
          if ((Get-FileHash $archivePath -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'NetBird checksum mismatch.'
          }
          tar -xzf $archivePath -C $netbirdDir netbird.exe
          if ($LASTEXITCODE -ne 0) { throw 'NetBird extraction failed.' }

      - name: Cache browser profile
        id: profile
        uses: actions/cache@v6
        with:
          path: .cache/toonation-profile.enc
          key: toonation-profile-portable-v2-windows-2025-${{ runner.arch }}-${{ steps.browser.outputs.profile-key-id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            toonation-profile-portable-v2-windows-2025-${{ runner.arch }}-${{ steps.browser.outputs.profile-key-id }}-

      - name: Restore encrypted browser profile
        env:
          BROWSER_PROFILE_KEY: ${{ secrets.BROWSER_PROFILE_KEY }}
        run: deno run --frozen -A profile-cache.ts restore

      - name: Run main.ts with NetBird
        shell: pwsh
        timeout-minutes: 10
        env:
          NB_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
          NB_USE_NETSTACK_MODE: 'true'
          TOONATION_ID: ${{ secrets.TOONATION_ID }}
          TOONATION_PASSWORD: ${{ secrets.TOONATION_PASSWORD }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BROWSER_PROFILE_CACHE_HIT: ${{ steps.profile.outputs.cache-hit }}
          LOGIN_CHECK_ONLY: ${{ inputs.login_check_only }}
        run: |
          $netbirdDir = Join-Path $env:RUNNER_TEMP 'netbird'
          $netbirdExe = Join-Path $netbirdDir 'netbird.exe'
          $daemon = Start-Process -FilePath $netbirdExe -ArgumentList 'service', 'run' -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput (Join-Path $netbirdDir 'service.log') `
            -RedirectStandardError (Join-Path $netbirdDir 'service-error.log')
          try {
            for ($attempt = 0; $attempt -lt 10; $attempt++) {
              if ($daemon.HasExited) { throw 'NetBird daemon exited before startup.' }
              & $netbirdExe status --check live *> $null
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds 1
            }
            if ($LASTEXITCODE -ne 0) { throw 'NetBird daemon startup timed out.' }
            & $netbirdExe up
            if ($LASTEXITCODE -ne 0) { throw 'NetBird login failed.' }

            $ready = $false
            for ($attempt = 0; $attempt -lt 10; $attempt++) {
              if ($daemon.HasExited) { throw 'NetBird daemon exited before connecting.' }
              & $netbirdExe status --check ready *> $null
              if ($LASTEXITCODE -eq 0) {
                $listener = Get-NetTCPConnection -LocalAddress 127.0.0.1 -LocalPort 1080 -State Listen -ErrorAction SilentlyContinue
                if ($listener) {
                  $ready = $true
                  break
                }
              }
              Start-Sleep -Seconds 2
            }
            if (-not $ready) { throw 'NetBird connection timed out.' }

            curl.exe --proxy socks5h://127.0.0.1:1080 --noproxy "" --connect-timeout 10 --max-time 30 `
              --silent --show-error --output NUL --write-out "Proxy check HTTP status: %{http_code}\n" `
              https://toon.at/streamer/dashboard
            if ($LASTEXITCODE -ne 0) { throw "NetBird SOCKS5 request failed (curl exit code: $LASTEXITCODE)." }

            deno run --frozen -A main.ts
            if ($LASTEXITCODE -ne 0) { throw "Crawling failed (Deno exit code: $LASTEXITCODE)." }
          } finally {
            Stop-Process -Id $daemon.Id -ErrorAction SilentlyContinue
          }

      - name: Encrypt browser profile
        env:
          BROWSER_PROFILE_KEY: ${{ secrets.BROWSER_PROFILE_KEY }}
        run: deno run --frozen -A profile-cache.ts save

      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

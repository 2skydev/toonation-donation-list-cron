name: Cron

on:
  schedule:
    - cron: '0 0-14 * * *' # KST 09:00 ~ 23:00
    - cron: '0 15-18 * * *' # KST 00:00 ~ 03:00
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      CLOAKBROWSER_AUTO_UPDATE: 'false'
      CLOAKBROWSER_CACHE_DIR: ${{ github.workspace }}/.cache/cloakbrowser
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.11
      
      - name: Install dependencies
        run: deno install --frozen

      - name: Resolve browser version
        id: browser
        run: |
          deno eval --frozen '
            import { binaryInfo } from "cloakbrowser";
            const { version, cacheDir } = binaryInfo();
            await Deno.writeTextFile(Deno.env.get("GITHUB_OUTPUT"), `version=${version}\npath=${cacheDir}\n`, { append: true });
            await Deno.writeTextFile(Deno.env.get("GITHUB_ENV"), `CLOAKBROWSER_VERSION=${version}\n`, { append: true });
          '

      - name: Cache CloakBrowser
        uses: actions/cache@v6
        with:
          path: ${{ steps.browser.outputs.path }}
          key: cloakbrowser-ubuntu-24.04-${{ runner.arch }}-${{ steps.browser.outputs.version }}-${{ hashFiles('deno.lock') }}

      - name: Download CloakBrowser
        run: |
          deno eval --frozen '
            import { ensureBinary } from "cloakbrowser";
            console.log(await ensureBinary());
          '

      - name: Check browser launch
        run: |
          deno eval --frozen '
            import { launch } from "cloakbrowser";
            const browser = await launch();
            console.log(await browser.version());
            await browser.close();
          '

      - name: Start NetBird
        env:
          NB_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          docker run --detach \
            --name netbird \
            --hostname "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --publish 127.0.0.1:1080:1080 \
            --env NB_SETUP_KEY \
            --env NB_USE_NETSTACK_MODE=true \
            --env NB_NETSTACK_SKIP_PROXY=false \
            --env NB_SOCKS5_LISTENER_ADDRESS=0.0.0.0 \
            --env NB_SOCKS5_LISTENER_PORT=1080 \
            netbirdio/netbird:0.79.0-rootless

          for attempt in {1..5}; do
            if docker exec netbird netbird status --check ready >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          echo "::error::NetBird connection timed out."
          exit 1


      - name: Run main.ts
        run: deno run --frozen -A main.ts
        env:
          TOONATION_ID: ${{ secrets.TOONATION_ID }}
          TOONATION_PASSWORD: ${{ secrets.TOONATION_PASSWORD }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}

name: Cron

on:
  schedule:
    - cron: '7 0-14 * * *' # KST 09:07 ~ 23:07
    - cron: '7 15-18 * * *' # KST 00:07 ~ 03:07
  workflow_dispatch:

jobs:
  cron:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      CLOAKBROWSER_AUTO_UPDATE: 'false'
      CLOAKBROWSER_CACHE_DIR: ${{ github.workspace }}/.cache/cloakbrowser
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.11
      
      - name: Install dependencies
        run: deno install --frozen

      - name: Resolve browser version
        id: browser
        run: |
          deno eval --frozen '
            import { binaryInfo } from "cloakbrowser";
            const { version, cacheDir } = binaryInfo();
            await Deno.writeTextFile(Deno.env.get("GITHUB_OUTPUT"), `version=${version}\npath=${cacheDir}\n`, { append: true });
            await Deno.writeTextFile(Deno.env.get("GITHUB_ENV"), `CLOAKBROWSER_VERSION=${version}\n`, { append: true });
          '

      - name: Cache CloakBrowser
        uses: actions/cache@v6
        with:
          path: ${{ steps.browser.outputs.path }}
          key: cloakbrowser-windows-2025-${{ runner.arch }}-${{ steps.browser.outputs.version }}-${{ hashFiles('deno.lock') }}

      - name: Download CloakBrowser
        run: |
          deno eval --frozen '
            import { ensureBinary } from "cloakbrowser";
            console.log(await ensureBinary());
          '

      - name: Check browser launch
        run: |
          deno eval --frozen '
            import { launch } from "cloakbrowser";
            const browser = await launch();
            console.log(await browser.version());
            await browser.close();
          '

      - name: Install NetBird
        shell: pwsh
        run: |
          $netbirdDir = Join-Path $env:RUNNER_TEMP 'netbird'
          New-Item -ItemType Directory -Path $netbirdDir -Force | Out-Null
          $archive = 'netbird_0.79.0_windows_amd64.tar.gz'
          $releaseUrl = 'https://github.com/netbirdio/netbird/releases/download/v0.79.0'
          $archivePath = Join-Path $netbirdDir $archive
          $checksumsPath = Join-Path $netbirdDir 'checksums.txt'
          Invoke-WebRequest "$releaseUrl/$archive" -OutFile $archivePath
          Invoke-WebRequest "$releaseUrl/netbird_0.79.0_checksums.txt" -OutFile $checksumsPath

          $checksumLine = Get-Content $checksumsPath | Where-Object { ($_ -split '\s+')[1] -eq $archive }
          if (-not $checksumLine) { throw 'NetBird checksum not found.' }
          $expectedHash = ($checksumLine -split '\s+')[0]
          if ((Get-FileHash $archivePath -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'NetBird checksum mismatch.'
          }
          tar -xzf $archivePath -C $netbirdDir netbird.exe
          if ($LASTEXITCODE -ne 0) { throw 'NetBird extraction failed.' }

      - name: Cache browser profile
        uses: actions/cache@v6
        with:
          path: .cache/toonation-profile
          key: toonation-profile-v1-windows-2025-${{ runner.arch }}-${{ steps.browser.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            toonation-profile-v1-windows-2025-${{ runner.arch }}-${{ steps.browser.outputs.version }}-

      - name: Run main.ts with NetBird
        shell: pwsh
        timeout-minutes: 10
        env:
          NB_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
          NB_STATE_DIR: ${{ runner.temp }}/netbird/state
          NB_CONFIG: ${{ runner.temp }}/netbird/state/default.json
          NB_DAEMON_ADDR: npipe://netbird-cron
          NB_LOG_FILE: ${{ runner.temp }}/netbird/client.log
          NB_USE_NETSTACK_MODE: 'true'
          NB_NETSTACK_SKIP_PROXY: 'false'
          NB_SOCKS5_LISTENER_ADDRESS: '127.0.0.1'
          NB_SOCKS5_LISTENER_PORT: '1080'
          TOONATION_ID: ${{ secrets.TOONATION_ID }}
          TOONATION_PASSWORD: ${{ secrets.TOONATION_PASSWORD }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          $netbirdDir = Join-Path $env:RUNNER_TEMP 'netbird'
          $netbirdExe = Join-Path $netbirdDir 'netbird.exe'
          New-Item -ItemType Directory -Path $env:NB_STATE_DIR -Force | Out-Null
          $daemon = Start-Process -FilePath $netbirdExe -ArgumentList 'service', 'run' -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput (Join-Path $netbirdDir 'service.log') `
            -RedirectStandardError (Join-Path $netbirdDir 'service-error.log')
          try {
            for ($attempt = 0; $attempt -lt 10; $attempt++) {
              if ($daemon.HasExited) { throw 'NetBird daemon exited before startup.' }
              & $netbirdExe status --check live *> $null
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds 1
            }
            if ($LASTEXITCODE -ne 0) { throw 'NetBird daemon startup timed out.' }
            & $netbirdExe up --hostname "gha-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            if ($LASTEXITCODE -ne 0) { throw 'NetBird login failed.' }

            $ready = $false
            for ($attempt = 0; $attempt -lt 10; $attempt++) {
              if ($daemon.HasExited) { throw 'NetBird daemon exited before connecting.' }
              & $netbirdExe status --check ready *> $null
              if ($LASTEXITCODE -eq 0) {
                $listener = Get-NetTCPConnection -LocalAddress 127.0.0.1 -LocalPort 1080 -State Listen -ErrorAction SilentlyContinue
                if ($listener) {
                  $ready = $true
                  break
                }
              }
              Start-Sleep -Seconds 2
            }
            if (-not $ready) { throw 'NetBird connection timed out.' }

            curl.exe --proxy socks5h://127.0.0.1:1080 --noproxy "" --connect-timeout 10 --max-time 30 `
              --silent --show-error --output NUL --write-out "Proxy check HTTP status: %{http_code}\n" `
              https://toon.at/streamer/dashboard
            if ($LASTEXITCODE -ne 0) { throw "NetBird SOCKS5 request failed (curl exit code: $LASTEXITCODE)." }

            deno run --frozen -A main.ts
            if ($LASTEXITCODE -ne 0) { throw "Crawling failed (Deno exit code: $LASTEXITCODE)." }
          } finally {
            Stop-Process -Id $daemon.Id -ErrorAction SilentlyContinue
          }
